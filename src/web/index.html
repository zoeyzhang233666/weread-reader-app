<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微信读书 Reader</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div class="top">
      <button class="tab" id="tab-shelf" data-active="1" type="button">书架</button>
      <button class="tab" id="tab-reading" type="button" disabled>阅读</button>
      <button class="tab" id="tab-settings" type="button">设置</button>
      <div class="spacer"></div>
      <span class="meta" id="login-meta">未登录</span>
    </div>
    <div id="error" class="error hidden"></div>
    <div class="body" id="body" data-mode="shelf"></div>
    <div class="bottom hidden" id="bottom">
      <button class="page-btn" id="btn-prev-chapter" type="button" title="上一章">‹‹</button>
      <button class="page-btn" id="btn-prev-page" type="button" title="上一页">‹</button>
      <div class="page-info">
        <strong id="bottom-title"></strong>
        <span id="bottom-meta"></span>
      </div>
      <button class="btn primary compact" id="btn-copy" type="button">复制本章</button>
      <button class="page-btn" id="btn-next-page" type="button" title="下一页">›</button>
      <button class="page-btn" id="btn-next-chapter" type="button" title="下一章">››</button>
    </div>
    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
